defaults:
  - data: phases
  - model: unet1d
  - training: default
  - _self_

# Databases, bucket and tables are in parameter/sources/default.yaml, read directly by
# phase.sources - the dataset build is not a Hydra job.

clearml:
  project_name: inhale-exhale-phase
  enabled: true
  timeout_s: 10
  # Which decoding passes get their figures and tables uploaded. Both are always written to disk;
  # this is only what the task carries. `viterbi` alone by default: `raw` is the same model scored
  # without post-processing, so uploading it doubles every figure and page to answer one question
  # - whether the decoder earned its place - which `raw_vs_viterbi` already answers with every
  # metric for both. Add `raw` back for an ablation, where the network's own output is the subject.
  passes: [viterbi]

plot:
  # 0 turns figures off.
  windows: 6
  # spread | worst | best | random. spread takes worst/median/best.
  pick: spread
  # The labelling app's own values, so a window reads the same in both places.
  phase_colors:
    inhale: "#4C9BE8"
    exhale: "#E8834C"
    stop: "#9AA0A6"
    unknown: "#C2A878"
  # Splits are not phases and must not share their palette.
  split_colors:
    train: "#3E7CB1"
    val: "#E8A34C"
    test: "#B5544A"
  span_alpha: 0.30
  trace_color: "#222222"

seed: 20260820
out_dir: out

hydra:
  run:
    dir: outputs/${now:%Y-%m-%d}/${now:%H-%M-%S}
  sweep:
    dir: outputs/multirun/${now:%Y-%m-%d}/${now:%H-%M-%S}
