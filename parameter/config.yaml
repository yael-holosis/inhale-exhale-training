# Hydra root. Everything a run depends on is here or in the groups below - no literals in code.
defaults:
  - data: algo_labels
  - model: unet1d
  - training: default
  - _self_

clearml:
  # The designated project. Credentials come from ~/clearml.conf, exactly as in `cough` -
  # nothing is written down in this repo, and DISABLE_CLEARML=true turns logging off entirely.
  project_name: inhale-exhale-phase
  enabled: true
  timeout_s: 10

# The labelling **app** repo - respiration-phase-labeling. It owns the connections to both
# instances, the RespirationWindow table, the window blobs in S3 and the call into production's
# phase calculation; it in turn reaches inhale-exhale-detection. This repo reads what it built.
# RESPIRATION_PHASE_LABELING_REPO overrides, so a second machine needs no file edited.
repos:
  labeling_app: ~/respiration-phase-labeling

seed: 20260820
out_dir: out

hydra:
  run:
    dir: outputs/${now:%Y-%m-%d}/${now:%H-%M-%S}
  sweep:
    dir: outputs/multirun/${now:%Y-%m-%d}/${now:%H-%M-%S}
