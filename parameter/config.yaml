# Hydra root. Everything a run depends on is here or in the groups below - no literals in code.
defaults:
  - data: phases
  - model: unet1d
  - training: default
  - _self_

# `parameter/sources/default.yaml` holds the databases, the bucket and the table names. It is
# read directly by `phase.sources` rather than composed here, because the dataset build is not a
# Hydra job and must not need the launcher to open a connection.

clearml:
  # The designated project. Credentials come from ~/clearml.conf, exactly as in `cough` -
  # nothing is written down in this repo, and DISABLE_CLEARML=true turns logging off entirely.
  project_name: inhale-exhale-phase
  enabled: true
  timeout_s: 10

# Figures drawn beside the metrics. A macro F1 does not say whether the breaths came out as
# breaths, and nobody goes back to draw a page for a run that looked fine at the time.
plot:
  windows: 6
  # Which windows: `spread` takes worst / median / best so a page shows the range rather than a
  # flattering sample of it. Also `worst`, `best`, `random`. Zero above turns figures off.
  pick: spread

seed: 20260820
out_dir: out

hydra:
  run:
    dir: outputs/${now:%Y-%m-%d}/${now:%H-%M-%S}
  sweep:
    dir: outputs/multirun/${now:%Y-%m-%d}/${now:%H-%M-%S}
