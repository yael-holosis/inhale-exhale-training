# One respiration window per row, one class per sample.
name: phases

root: data_sets
# `latest` is the newest build under root.
dir: latest

env: [ds_algo, ds_prod]
# Prefixes matching the display name (SL0066) or the patient key (bs-). Null takes everyone.
patients: null
# Dropped even if `patients` would take them. SL_QA is the QA rig, not a person.
exclude_patients: [SL_QA]
signals_per_patient: null
sample_seed: 20260819

labels:
  # algorithm - production's own phase call, re-run. Every window, but imitation not truth.
  # human     - the spans a person drew. Fewer windows, the only measure of correctness.
  # A directory holds one source; the build refuses to mix them.
  source: algorithm

  # human only. Null takes every labeller; an id takes one person alone.
  labeler_id: null
  # human only, where two people labelled one window: latest | lowest_id.
  on_conflict: latest
  # Negate the waveform where ReviewerFlipped is set. Amplitude only, indices unaffected.
  orient_by_reviewer_flip: true
  # No stored rate means no algorithm phases. Kept, labelled unknown - dropping them would bias
  # the set towards easy breathing. human ignores this.
  requires_rate: true

# Written into the dataset by make_splits.py, never recomputed at train time.
split:
  test_fraction: 0.2
  # make_splits.py cuts this many; train.py trains this many and aggregates them.
  folds: 5
  seed: 20260820
  # A split may not cut through these. env is part of the identity - the instances have
  # unrelated name spaces, so without it two people sharing a name would merge.
  group_columns: [env, PatientID]
  # Balanced across test and folds. Empty disables stratification.
  stratify_cols: [env]

# Null keeps each window its own length - the net is fully convolutional and collate pads per
# batch. A crop drops the long windows, which are the hard ones.
crop_samples: null
# Per-window z-score: what the device can do at inference, having no corpus statistics.
normalise: window

batch_size: 64
num_workers: 4
