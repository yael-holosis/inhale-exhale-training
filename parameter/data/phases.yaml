# One respiration window per row, one class per sample.
name: phases

root: data_sets
# `latest` is the newest build under root.
dir: latest

env: [ds_algo, ds_prod]
# Prefixes matching the display name (SL0066) or the patient key (bs-). Null takes everyone.
patients: null
# Dropped even if `patients` would take them. SL_QA is the QA rig, not a person.
exclude_patients: [SL_QA]
signals_per_patient: null
sample_seed: 20260819

labels:
  # algorithm - production's own phase call, re-run. Every window, but imitation not truth.
  # human     - the spans a person drew. Fewer windows, the only measure of correctness.
  # A directory holds one source; the build refuses to mix them.
  source: algorithm

  # human only. Null takes every labeller; an id takes one person alone.
  labeler_id: null
  # human only. Labellers to drop, by LabelerName.ID. Their spans are excluded from the target
  # AND from the labelled count, so a window only they labelled is not kept empty.
  exclude_labeler_ids: []
  # human only, where two people labelled one window: latest | lowest_id.
  on_conflict: latest
  # Off. The labelling app draws the blob as stored and the spans were drawn on that view, so
  # the flip is already accounted for upstream - negating again inverts inhale and exhale.
  orient_by_reviewer_flip: false
  # No stored rate means no algorithm phases. Kept, labelled unknown - dropping them would bias
  # the set towards easy breathing. human ignores this.
  requires_rate: true

  # Applied to the per-sample target before it reaches a shard, so this is what the network sees
  # and what every figure reads back. The labelling as drawn stays in the shard, so
  # `build_dataset.py --recorrect` re-derives a dataset under new values without the database.
  corrections:
    # A labelled span that runs to the window boundary becomes unknown, whole: the boundary cut
    # that breath and whether a labeller marks the fragment is inconsistent. Only a span actually
    # touching an edge - a window opening with unknown was already read that way. Costs 8.4% of
    # the labelled samples.
    blank_edge_spans: false
    # A window more than this fraction unknown - measured after the edge spans - becomes entirely
    # unknown. It stays in the set; it just stops claiming phases. Null disables.
    all_unknown_above: null

# Written into the dataset by make_splits.py, never recomputed at train time.
split:
  test_fraction: 0.2
  # make_splits.py cuts this many; train.py trains this many and aggregates them.
  folds: 5
  seed: 20260820
  # A split may not cut through these. env is part of the identity - the instances have
  # unrelated name spaces, so without it two people sharing a name would merge.
  group_columns: [env, PatientID]
  # Balanced across test and folds. `study` is the patient-name prefix (SL, HOL, bs) - a study
  # is a recruitment criterion, so it carries a pathology mix. Empty disables stratification.
  stratify_cols: [study]

# Null keeps each window its own length - the net is fully convolutional and collate pads per
# batch. A crop drops the long windows, which are the hard ones.
crop_samples: null
# Per-window z-score: what the device can do at inference, having no corpus statistics.
normalise: window

batch_size: 64
num_workers: 4
