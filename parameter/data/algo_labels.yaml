# The dataset built by `build_dataset.py`: the windows already in `RespirationWindow`, labelled
# by production's own inhale/exhale calculation. See phase/building.py for what that means and
# does not mean. **No raw scan is read** - the app repo already ran the pipeline to build these
# windows, so a build here is two reads and a function call.
name: algo_labels
dir: data_sets/algo_labels

# Which instance. `ds_algo` is the data-science cohort - the SL sleep-lab nights, and where
# nearly every uploaded window is; `ds_prod` is the pilots. Run each separately into the same
# directory; nothing is ever written to production.
env: ds_algo
# Patient prefixes, matching the display name (SL0066) or the patient key (algo-p089, bs-).
# Null is every patient with uploaded windows.
patients: null
# Cap on signals per patient, sampled seeded and spread across sessions. Null takes everything
# uploaded - the right setting while the uploaded pool is this small.
signals_per_patient: null
# Sampling seed. The same seed gives the same signals across processes and across machines.
sample_seed: 20260819
# A window with no stored rate has nothing for the detector to run at, so it carries no phases.
# Kept and labelled entirely unknown - "the algorithm found nothing here" is a training signal,
# and dropping those windows would bias the set towards easy breathing.
requires_rate: true

# 200 samples = the pipeline's own 20 s window at 10 fps. Longer windows (it grows one by 5 s
# and retries when it cannot find three breaths) are cropped; shorter ones are padded and masked.
crop_samples: 200
# 'window' z-scores each item on its own statistics - what the device can do at inference, since
# it has no corpus statistics to hand.
normalise: window

folds: 5
fold: 0
# Carved out of train by patient, never out of test. Anything that picks a checkpoint needs it.
val_fraction: 0.2

batch_size: 64
num_workers: 4
