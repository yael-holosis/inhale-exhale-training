max_epochs: 60
lr: 0.003
weight_decay: 0.0001
scheduler: cosine
precision: 32
accelerator: auto
early_stopping_patience: 12
monitor: val/macro_f1
monitor_mode: max

ce_weight: 1.0
dice_weight: 1.0
# Inverse frequency from the training split, softened and capped - a raw inverse hands the whole
# loss to the rarest class.
class_weight_power: 0.5
class_weight_cap: 10.0

event_iou: 0.5

# No polarity flip: labels.orient_by_reviewer_flip fixes the polarity, and negating half the
# windows would undo it. amplitude_* is a no-op under per-window z-scoring.
augmentation:
  time_warp_prob: 0.5
  time_warp_range: [0.8, 1.25]
  amplitude_prob: 0.5
  amplitude_range: [0.5, 2.0]
  drift_prob: 0.3
  drift_scale: 0.3
  noise_prob: 0.3
  noise_scale: 0.05

decoding:
  viterbi: true
  enforce_min: true
  switch_penalty: 2.0
  # Samples at 10 fps. Anything shorter is a decoder artefact, not a breath.
  min_duration: {unknown: 1, inhale: 3, exhale: 3, stop: 2}
  # Describes THIS label set, not physiology: production emits no phase at the turn, so
  # inhale -> unknown -> exhale is normal and inhale -> exhale does not occur.
  allowed:
    unknown: [inhale, exhale, stop]
    inhale:  [unknown]
    exhale:  [unknown, stop]
    stop:    [unknown, inhale]
