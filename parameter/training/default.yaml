max_epochs: 60
lr: 0.003
weight_decay: 0.0001
scheduler: cosine
precision: 32
accelerator: auto
early_stopping_patience: 12
monitor: val/macro_f1
monitor_mode: max

ce_weight: 1.0
dice_weight: 1.0
# Inverse frequency from the training split, softened and capped - a raw inverse hands the whole
# loss to the rarest class.
class_weight_power: 0.5
class_weight_cap: 10.0

event_iou: 0.5

# No polarity flip: labels.orient_by_reviewer_flip fixes the polarity, and negating half the
# windows would undo it. amplitude_* is a no-op under per-window z-scoring.
augmentation:
  time_warp_prob: 0.5
  time_warp_range: [0.8, 1.25]
  amplitude_prob: 0.5
  amplitude_range: [0.5, 2.0]
  drift_prob: 0.3
  drift_scale: 0.3
  noise_prob: 0.3
  noise_scale: 0.05

decoding:
  viterbi: true
  enforce_min: true
  switch_penalty: 2.0
  # Samples at 10 fps. Anything shorter is a decoder artefact, not a breath.
  min_duration: {unknown: 1, inhale: 3, exhale: 3, stop: 2}
  # Which class may follow which. Describes the LABEL SET, not physiology, so there is one table
  # per source - a table from the wrong one forbids transitions the labels are full of, and
  # Viterbi then bridges them with a one-sample `unknown` on every breath.
  allowed:
    # Production emits no phase at the turn, so inhale -> unknown -> exhale is the normal path
    # and inhale -> exhale does not occur.
    algorithm:
      unknown: [inhale, exhale, stop]
      inhale:  [unknown]
      exhale:  [unknown, stop]
      stop:    [unknown, inhale]
    # People draw the phases touching. Measured over 7,713 span transitions in the human set:
    # inhale->exhale 33.3%, stop->inhale 30.0%, exhale->stop 29.9%, exhale->inhale 2.2%, and
    # everything into or out of `unknown` under 2%. Only inhale->stop is absent (1 occurrence).
    human:
      unknown: [inhale, exhale, stop]
      inhale:  [exhale, unknown]
      exhale:  [stop, inhale, unknown]
      stop:    [inhale, unknown]
