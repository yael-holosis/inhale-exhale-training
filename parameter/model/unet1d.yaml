# 1D U-Net, U-Time shaped, with depthwise-separable convolutions.
name: unet1d
in_channels: 1
# One width per encoder level; the length is the depth.
channels: [16, 24, 32]
bottleneck: 48
kernel_size: 9
dropout: 0.0
# Depth 3 / kernel 9: 18,188 parameters, 353-sample receptive field (35 s), which covers a
# 20 s window with margin. Depth 4 ([16,24,32,48]/64) is 35,932 and 737 samples - for running
# on a whole signal rather than on windows.
